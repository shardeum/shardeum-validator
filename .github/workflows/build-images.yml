name: Build Docker Images

# Add permissions configuration
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to build for'
        required: true
        type: choice
        options:
          - mainnet
          - stagenet
          - testnet
        default: 'testnet'
      validator_branch:
        description: 'Validator branch to use'
        type: string
      cli_branch:
        description: 'CLI branch to use'
        type: string
      gui_branch:
        description: 'GUI branch to use'
        type: string
      tag:
        description: 'Tag for the Docker images'
        required: true
        type: string
      push_latest:
        description: 'Push latest tag (DONT DO THIS UNLESS YOU KNOW WHAT YOU ARE DOING)'
        type: boolean
        required: true
        default: false

jobs:
  build:
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: [self-hosted, Linux, X64]
          - arch: arm64
            runner: [self-hosted, Linux, ARM64]
    runs-on: ${{ matrix.runner }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Override branch variables in config
        run: |
          CONFIG="scripts/configs/${{ inputs.network }}.sh"
          if [ -n "${{ inputs.validator_branch }}" ]; then
            sed -i 's/^export VALIDATOR_BRANCH=.*/export VALIDATOR_BRANCH="${{ inputs.validator_branch }}"/' "$CONFIG"
          fi
          if [ -n "${{ inputs.cli_branch }}" ]; then
            sed -i 's/^export CLI_BRANCH=.*/export CLI_BRANCH="${{ inputs.cli_branch }}"/' "$CONFIG"
          fi
          if [ -n "${{ inputs.gui_branch }}" ]; then
            sed -i 's/^export GUI_BRANCH=.*/export GUI_BRANCH="${{ inputs.gui_branch }}"/' "$CONFIG"
          fi

      - name: Build Docker image using script
        run: |
          ./scripts/build-network.sh ${{ inputs.network }} ${{ inputs.tag }} ${{ matrix.arch }} ${{ env.REGISTRY }}

      - name: Push Docker image and cleanup
        run: |
          # Construct the image name exactly as the script does
          IMAGE_NAME_FULL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:${{ inputs.network }}-${{ inputs.tag }}"
          echo "Pushing: $IMAGE_NAME_FULL"
          docker push "$IMAGE_NAME_FULL"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.push_latest }}" == "true" ]; then
            docker tag "$IMAGE_NAME_FULL" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:latest
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:latest
            docker rmi ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:latest
          fi
          echo "Removing: $IMAGE_NAME_FULL"
          docker rmi "$IMAGE_NAME_FULL"
          
  create-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create and push manifest per network and capture digest
        id: push_network_manifest
        run: |
          MANIFEST_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.network }}-${{ inputs.tag }}"
          IMG_AMD64="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-amd64:${{ inputs.network }}-${{ inputs.tag }}"
          IMG_ARM64="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-arm64:${{ inputs.network }}-${{ inputs.tag }}"
          echo "Creating manifest: $MANIFEST_NAME from $IMG_AMD64 and $IMG_ARM64"
          docker manifest create "$MANIFEST_NAME" \
            "$IMG_AMD64" \
            "$IMG_ARM64"
          echo "Pushing manifest: $MANIFEST_NAME"
          MANIFEST_DIGEST=$(docker manifest push "$MANIFEST_NAME")
          echo "Pushed manifest digest for ${MANIFEST_NAME}: $MANIFEST_DIGEST"
          echo "digest=$MANIFEST_DIGEST" >> $GITHUB_OUTPUT
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.push_latest }}" == "true" ]; then
            echo "Creating and pushing latest manifest as push_latest is true"
            docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-amd64:latest \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-arm64:latest
            docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          fi 

      - name: Send Slack notification for image build
        if: success() # Only run this step if previous steps succeed
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":hammer_and_wrench: New Image Build Completed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repository:*\n`${{ github.repository }}`" },
                    { "type": "mrkdwn", "text": "*Network:*\n`${{ inputs.network }}`" },
                    { "type": "mrkdwn", "text": "*Tag:*\n`${{ inputs.tag }}`" },
                    { "type": "mrkdwn", "text": "*Validator Branch:*\n`${{ inputs.validator_branch }}`" },
                    { "type": "mrkdwn", "text": "*CLI Branch:*\n`${{ inputs.cli_branch }}`" },
                    { "type": "mrkdwn", "text": "*GUI Branch:*\n`${{ inputs.gui_branch }}`" }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Manifest Digest (${{ inputs.network }}-${{ inputs.tag }}):*\n`${{ steps.push_network_manifest.outputs.digest }}`"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Triggered by `${{ github.actor }}`. See run: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} # IMPORTANT: Ensure this secret is configured
