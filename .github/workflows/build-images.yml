name: Build Docker Images

on:
  push:
    tags:
      - '*'

jobs:
  build:
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: arm64-latest
    runs-on: ${{ matrix.runner }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract tag name
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/shardeum/shardeum-validator-${{ matrix.arch }}:${{ env.TAG }}
          build-args: |
            VALIDATOR_BRANCH=itn4-1.16.3
            CLI_BRANCH=itn4
            GUI_BRANCH=itn4

  create-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract tag name
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      
      - name: Create and push manifest
        run: |
          docker manifest create ghcr.io/shardeum/shardeum-validator:${{ env.TAG }} \
            ghcr.io/shardeum/shardeum-validator-amd64:${{ env.TAG }} \
            ghcr.io/shardeum/shardeum-validator-arm64:${{ env.TAG }}
          docker manifest push ghcr.io/shardeum/shardeum-validator:${{ env.TAG }} 